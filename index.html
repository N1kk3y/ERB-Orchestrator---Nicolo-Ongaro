<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Airfoil Editor Pro - Simple</title>
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <div class="app-shell">
      <div class="main-row">
        <div class="canvas-pane" id="canvasPane">
          <canvas id="sceneCanvas"></canvas>
          <div class="hud" id="hud"></div>
        </div>

        <aside class="side-panel">
          <section class="panel-block domain-block">
            <h3>Domain Settings</h3>
            <div class="domain-grid">
              <label>
                <span>Height (m)</span>
                <input id="domainHeight" type="number" step="0.1" />
              </label>
              <label>
                <span>Width (m)</span>
                <input id="domainWidth" type="number" step="0.1" />
              </label>
              <label>
                <span>Ground (m)</span>
                <input id="domainGround" type="number" step="0.01" />
              </label>
            </div>
          </section>

          <section class="panel-block profiles-block">
            <div class="profiles-head">
              <h3>Profiles</h3>
              <label class="import-btn">
                <span>+ Import</span>
                <input id="fileInput" type="file" accept=".txt" />
              </label>
            </div>
            <div class="profiles-list" id="profilesList"></div>
          </section>

          <section class="panel-block properties-block">
            <h3>Properties</h3>
            <div id="propertiesContent" class="properties-content"></div>
          </section>
        </aside>
      </div>

      <section class="params-panel" id="paramsPanel">
        <header class="params-head" id="paramsToggle">
          <h4>▦ Ansys Parameter Set</h4>
          <button id="paramsArrow" type="button">▼</button>
        </header>
        <div class="params-body" id="paramsBody"></div>
      </section>
    </div>

    <div class="modal-backdrop hidden" id="importModal">
      <div class="modal-card">
        <h3>Import Profile</h3>
        <div class="preview-wrap" id="previewWrap"></div>
        <div class="modal-actions">
          <button id="importMainBtn" class="btn-main" type="button">
            <strong>Import as MAIN</strong>
            <span>Base anchor profile</span>
          </button>
          <button id="importFlapBtn" class="btn-flap" type="button">
            <strong>Import as FLAP</strong>
            <span>Attaches to trailing edge</span>
          </button>
        </div>
        <button id="importCancelBtn" class="btn-cancel" type="button">Cancel</button>
      </div>
    </div>

    <script src="./index.js"></script>
  </body>
</html>
